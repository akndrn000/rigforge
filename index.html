      content="Tempel data mentah avatar, dapatkan ModuleScript Lua yang rapi untuk Roblox Studio. Diproses di browser."

    <meta property="og:image" content="__SITE_URL__/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "RigForge",
        "url": "__SITE_URL__/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "inLanguage": "id",
        "description": "Konverter data mentah avatar Roblox menjadi script Lua untuk Roblox Studio."
      }
    </script>

    <!-- Terapkan tema sebelum render pertama agar tidak berkedip -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('rl-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Situs ini membutuhkan JavaScript untuk mengonversi data avatar di browser Anda.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
