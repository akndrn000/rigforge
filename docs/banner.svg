<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="RigForge">
  <!-- Banner neobrutalism modern: krem berpola titik, blok pink/kuning/mint,
       logo kotak kuning miring, sudut membulat, bayangan keras hitam. -->
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#111111" opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="#FFFBEB"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect x="8" y="8" width="1184" height="284" rx="14" fill="none" stroke="#111111" stroke-width="4"/>

  <g font-family="'JetBrains Mono', Consolas, Menlo, monospace">
    <!-- logo miring -->
    <g transform="rotate(-4 101 105)">
      <rect x="76" y="80" width="62" height="62" rx="14" fill="#111111"/>
      <rect x="70" y="74" width="62" height="62" rx="14" fill="#FFD60A" stroke="#111111" stroke-width="3"/>
      <path d="M92 90l-14 15 14 15M110 90l14 15-14 15" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="150" y="100" width="300" height="26" fill="#FF8FCB"/>
    <text x="152" y="128" font-size="64" font-weight="800" fill="#111111" letter-spacing="-2">RigForge</text>
    <text x="72" y="178" font-size="23" font-weight="400" fill="#4B4B55">Ubah data avatar Roblox jadi script Lua siap pakai.</text>

    <!-- chips -->
    <g font-size="15" font-weight="700">
      <rect x="77" y="213" width="170" height="34" rx="10" fill="#111111"/>
      <rect x="72" y="208" width="170" height="34" rx="10" fill="#7CF2B4" stroke="#111111" stroke-width="3"/>
      <text x="157" y="231" text-anchor="middle" fill="#111111">Tempel → Salin</text>
      <rect x="265" y="213" width="196" height="34" rx="10" fill="#111111"/>
      <rect x="260" y="208" width="196" height="34" rx="10" fill="#ffffff" stroke="#111111" stroke-width="3"/>
      <text x="358" y="231" text-anchor="middle" fill="#111111">Diproses di browser</text>
      <rect x="479" y="213" width="190" height="34" rx="10" fill="#111111"/>
      <rect x="474" y="208" width="190" height="34" rx="10" fill="#ffffff" stroke="#111111" stroke-width="3"/>
      <text x="569" y="231" text-anchor="middle" fill="#111111">Tanpa login/server</text>
    </g>
  </g>

  <!-- raw card -->
  <g font-family="'JetBrains Mono', Consolas, Menlo, monospace">
    <rect x="737" y="61" width="200" height="176" rx="14" fill="#111111"/>
    <rect x="732" y="56" width="200" height="176" rx="14" fill="#ffffff" stroke="#111111" stroke-width="3"/>
    <path d="M732 70 a14 14 0 0 1 14 -14 h172 a14 14 0 0 1 14 14 v16 h-200 z" fill="#FF8FCB"/>
    <line x1="732" y1="86" x2="932" y2="86" stroke="#111111" stroke-width="3"/>
    <text x="746" y="77" font-size="13" font-weight="800" fill="#111111">Data mentah</text>
    <g font-size="13" fill="#111111">
      <text x="746" y="108">Head: 78735857422004</text>
      <text x="746" y="130">Torso: 114206707267907</text>
      <text x="746" y="152">LeftArm: 11229787805…</text>
      <text x="746" y="174">Shirt: 11875410852</text>
      <text x="746" y="196">Body Color: (#F2D7CD)</text>
      <text x="746" y="218" fill="#4B4B55">…</text>
    </g>

    <!-- arrow -->
    <rect x="949" y="133" width="52" height="52" rx="12" fill="#111111"/>
    <rect x="944" y="128" width="52" height="52" rx="12" fill="#FF9F43" stroke="#111111" stroke-width="3"/>
    <path d="M957 154h26M974 142l12 12-12 12" fill="none" stroke="#111111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- lua card -->
    <rect x="1019" y="67" width="150" height="176" rx="14" fill="#111111"/>
    <rect x="1014" y="62" width="150" height="176" rx="14" fill="#ffffff" stroke="#111111" stroke-width="3"/>
    <path d="M1014 76 a14 14 0 0 1 14 -14 h122 a14 14 0 0 1 14 14 v16 h-150 z" fill="#FFD60A"/>
    <line x1="1014" y1="92" x2="1164" y2="92" stroke="#111111" stroke-width="3"/>
    <text x="1028" y="83" font-size="13" font-weight="800" fill="#111111">Hasil Lua</text>
    <g font-size="13">
      <text x="1028" y="116" fill="#111111">Body = {</text>
      <text x="1040" y="138" fill="#111111">Head = 787…</text>
      <text x="1040" y="160" fill="#111111">Torso = 114…</text>
      <text x="1028" y="182" fill="#111111">},</text>
      <text x="1028" y="204" fill="#111111">SkinTone =</text>
      <text x="1028" y="226" fill="#111111">"#F2D7CD"</text>
    </g>
  </g>
</svg>
