    <rect x="732" y="56" width="200" height="176" fill="#fff" stroke="#111" stroke-width="4"/>
    <rect x="732" y="56" width="200" height="30" fill="#FFD600" stroke="#111" stroke-width="4"/>
    <text x="746" y="77" font-size="13" font-weight="700" fill="#111">Data mentah</text>
    <g font-size="13" fill="#111">
