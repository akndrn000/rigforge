    <!-- arrow -->
    <rect x="948" y="132" width="52" height="52" fill="#111"/>
    <rect x="944" y="128" width="52" height="52" fill="#FFD600" stroke="#111" stroke-width="4"/>
    <path d="M957 154h26M974 142l12 12-12 12" fill="none" stroke="#111" stroke-width="5" stroke-linecap="square"/>

    <!-- lua card -->
    <rect x="1020" y="68" width="150" height="176" fill="#FFD600"/>
    <rect x="1014" y="62" width="150" height="176" fill="#161616" stroke="#111" stroke-width="4"/>
    <g font-size="13">
      <text x="1028" y="90" fill="#FFD600">return</text><text x="1082" y="90" fill="#f2f2f2">{</text>
      <text x="1040" y="112" fill="#f2f2f2">Body = {</text>
      <text x="1052" y="134" fill="#f2f2f2">Head = <tspan fill="#3ddc84">787…</tspan></text>
      <text x="1052" y="156" fill="#f2f2f2">Torso = <tspan fill="#3ddc84">114…</tspan></text>
      <text x="1040" y="178" fill="#f2f2f2">},</text>
      <text x="1040" y="200" fill="#f2f2f2">SkinTone =</text>
